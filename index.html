<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-MP Vehicle Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff9900;
        }
        /* Style untuk Menu Navigasi */
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .navbar a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .navbar a:hover {
            background-color: #ff9900;
            border-radius: 5px;
        }
        /* Style untuk Kartu Produk/Gambar */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background-color: #2b2b2b;
            border-radius: 10px;
            width: 250px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .price {
            color: #00ff22;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <h1>SA-MP VEHICLE DEALERSHIP</h1>

    <!-- MENU NAVIGASI -->
    <div class="navbar">
        <a href="#sport">Mobil Sport</a>
        <a href="#motor">Motor Sport</a>
        <a href="#udara">Pesawat & Heli</a>
    </div>

    <!-- DAFTAR KENDARAAN (GAMBAR & HARGA) -->
    <div class="container">
        
        <!-- Kartu 1 -->
        <div class="card" id="sport">
            <img src="https://wiki.sa-mp.com/w/images/d/d1/Vehicle_411.jpg" alt="Infernus">
            <div class="card-content">
                <h3>Infernus</h3>
                <p>Kategori: Mobil Sport</p>
                <p class="price">$250,000</p>
            </div>
        </div>

        <!-- Kartu 2 -->
        <div class="card" id="motor">
            <img src="https://wiki.sa-mp.com/w/images/e/e0/Vehicle_522.jpg" alt="NRG-500">
            <div class="card-content">
                <h3>NRG-500</h3>
                <p>Kategori: Motor Sport</p>
                <p class="price">$100,000</p>
            </div>
        </div>

        <!-- Kartu 3 -->
        <div class="card" id="udara">
            <img src="https://wiki.sa-mp.com/w/images/0/07/Vehicle_519.jpg" alt="Shamal">
            <div class="card-content">
                <h3>Shamal</h3>
                <p>Kategori: Pesawat Jet</p>
                <p class="price">$1,200,000</p>
            </div>
        </div>

    </div>

</body>
</html>
