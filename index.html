<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toko SAMP</title><link rel="stylesheet" href="assets/style.css">
<script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="ISI_CLIENT_KEY_MIDTRANS"></script>
</head>
<body>
<header><div class="hamb">☰</div><div class="logo">💎 TOKO SAMP</div><a href="admin/login.php" class="admin">Admin</a></header>
<main>
<h1>Toko SAMP</h1>
<section class="card"><div class="step"><b>1</b><h2>Masukkan Player ID</h2></div>
<input id="player" placeholder="Masukkan Player ID / Username"><p>Pastikan ID/username SAMP benar sebelum order.</p></section>

<section class="card"><div class="step"><b>2</b><h2>Pilih Produk</h2></div><div id="products" class="products"></div></section>

<section class="card"><div class="step"><b>3</b><h2>Detail & Pembayaran</h2></div>
<div class="summary">Player: <strong id="sp">-</strong><br>Produk: <strong id="sn">-</strong><br><span class="total">Total: <span id="st">Rp0</span></span></div>
<button id="order">💳 BAYAR SEKARANG</button><div id="msg"></div>
</section>
</main>
<script>
let selected=null;
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
async function load(){
 const r=await fetch('api/products.php'); const data=await r.json();
 products.innerHTML=data.map((x,i)=>`<div class="product ${i?'':'active'}" data-id="${x.id}"><h3>${x.name}</h3><div class="price">${rp(x.price)}</div><small>${x.description||''}</small></div>`).join('');
 selected=data[0];update();
 document.querySelectorAll('.product').forEach(el=>el.onclick=()=>{document.querySelectorAll('.product').forEach(x=>x.classList.remove('active'));el.classList.add('active');selected=data.find(x=>x.id==el.dataset.id);update()});
}
function update(){sp.textContent=player.value||'-';sn.textContent=selected?.name||'-';st.textContent=selected?rp(selected.price):'Rp0'}
player.oninput=update;
order.onclick=async()=>{
 msg.textContent='Membuat pembayaran...';
 if(!player.value.trim()||!selected){msg.textContent='Isi Player ID dan pilih produk.';return}
 const r=await fetch('api/payment.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_id:player.value.trim(),product_id:selected.id})});
 const d=await r.json();
 if(!r.ok||!d.token){msg.textContent=d.message||'Gagal membuat pembayaran.';return}
 snap.pay(d.token,{
  onSuccess:function(result){msg.textContent='Pembayaran berhasil. Kode order: '+d.order_code;},
  onPending:function(result){msg.textContent='Pembayaran masih menunggu. Kode order: '+d.order_code;},
  onError:function(result){msg.textContent='Pembayaran gagal. Silakan coba lagi.';},
  onClose:function(){msg.textContent='Halaman pembayaran ditutup. Kamu bisa mencoba lagi.';}
 });
};
load();
</script></body></html>
