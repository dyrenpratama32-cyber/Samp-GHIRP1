<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-MP Shop & Cart</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        h1, h2 { text-align: center; color: #ff9900; }
        
        /* Container Utama Layout Grid */
        .main-layout { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: auto; }
        .shop-section { flex: 2; min-width: 300px; }
        .cart-section { flex: 1; min-width: 280px; background: #2b2b2b; padding: 15px; border-radius: 8px; height: fit-content; }
        
        /* Katalog Produk */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #2b2b2b; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #444; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
        .price { color: #00ff22; font-weight: bold; margin: 5px 0; }
        
        /* Tombol Beli */
        .btn-buy { background: #ff9900; color: #000; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-buy:hover { background: #e68a00; }
        
        /* Panel Keranjang & Pesanan */
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding: 8px 0; }
        .total-box { font-size: 1.2em; font-weight: bold; margin-top: 15px; text-align: right; color: #00ff22; }
        .btn-checkout { background: #00ff22; color: #000; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .order-history { margin-top: 15px; background: #1a1a1a; padding: 10px; border-radius: 5px; font-size: 0.9em; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>SA-MP DEALERSHIP STORE</h1>

    <div class="main-layout">
        <!-- KATALOG PRODUK -->
        <div class="shop-section">
            <h2>Katalog Kendaraan</h2>
            <div class="grid-container">
                
                <div class="card">
                    <img src="https://wiki.sa-mp.com/w/images/d/d1/Vehicle_411.jpg" alt="Infernus">
                    <h3>Infernus</h3>
                    <div class="price">$250,000</div>
                    <button class="btn-buy" onclick="addToCart('Infernus', 250000)">+ Tambah</button>
                </div>

                <div class="card">
                    <img src="https://wiki.sa-mp.com/w/images/e/e0/Vehicle_522.jpg" alt="NRG-500">
                    <h3>NRG-500</h3>
                    <div class="price">$100,000</div>
                    <button class="btn-buy" onclick="addToCart('NRG-500', 100000)">+ Tambah</button>
                </div>

                <div class="card">
                    <img src="https://wiki.sa-mp.com/w/images/0/07/Vehicle_519.jpg" alt="Shamal">
                    <h3>Shamal Jet</h3>
                    <div class="price">$1,200,000</div>
                    <button class="btn-buy" onclick="addToCart('Shamal Jet', 1200000)">+ Tambah</button>
                </div>

                <div class="card">
                    <img src="https://wiki.sa-mp.com/w/images/d/d7/Vehicle_487.jpg" alt="Maverick">
                    <h3>Maverick</h3>
                    <div class="price">$500,000</div>
                    <button class="btn-buy" onclick="addToCart('Maverick Heli', 500000)">+ Tambah</button>
                </div>

            </div>
        </div>

        <!-- PANEL KERANJANG & PESANAN PLAYER -->
        <div class="cart-section">
            <h2>🛒 Keranjang Anda</h2>
            <div id="cart-list">
                <p style="color: #888; text-align: center;">Keranjang masih kosong</p>
            </div>
            
            <div class="total-box">
                Total: $<span id="total-price">0</span>
            </div>
            
            <button class="btn-checkout" onclick="checkout()">Checkout / Beli Sekarang</button>

            <!-- PANEL HASIL TRANSAKSI PLAYER -->
            <h3 style="margin-top: 20px; font-size: 1em;">📋 Riwayat Pembelian Player:</h3>
            <div class="order-history" id="order-history">
                <span style="color: #888;">Belum ada transaksi...</span>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT SYSTEM -->
    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name, price });
            total += price;
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            const totalPrice = document.getElementById('total-price');

            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color: #888; text-align: center;">Keranjang masih kosong</p>';
            } else {
                cartList.innerHTML = '';
                cart.forEach((item, index) => {
                    cartList.innerHTML += `
                        <div class="cart-item">
                            <span>${item.name}</span>
                            <span>$${item.price.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            totalPrice.innerText = total.toLocaleString();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Keranjang Anda masih kosong!");
                return;
            }

            const history = document.getElementById('order-history');
            const time = new Date().toLocaleTimeString();
            
            let purchasedItems = cart.map(i => i.name).join(", ");
            
            if (history.innerHTML.includes("Belum ada transaksi")) {
                history.innerHTML = "";
            }

            history.innerHTML = `<div>[${time}] Berhasil Membeli: <b>${purchasedItems}</b> ($${total.toLocaleString()})</div>` + history.innerHTML;

            alert("Pembelian Berhasil! Total yang dibayar: $" + total.toLocaleString());
            
            // Reset Keranjang
            cart = [];
            total = 0;
            updateCartUI();
        }
    </script>
</body>
</html>
